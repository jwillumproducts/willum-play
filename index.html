<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Willum Play – rolige spil for børn</title>
    <meta
      name="description"
      content="Willum Play er små rolige spil i browseren, hvor børn øver tastatur, controller eller touch én knap ad gangen. Ingen konto, tid eller nederlag."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23ffd15c'/%3E%3C/svg%3E"
    />
    <script>
      ;(function () {
        var codes = ['da', 'en', 'es', 'de', 'zh', 'hi', 'fr']
        var parts = location.pathname.split('/').filter(Boolean)
        if (parts[parts.length - 1] === 'index.html') parts.pop()
        for (var i = 0; i < parts.length; i++) {
          if (codes.indexOf(parts[i]) >= 0) return
        }
        var saved = ''
        try {
          saved = localStorage.getItem('willum-play.lang') || localStorage.getItem('miniplay.lang') || ''
        } catch (error) {}
        var lang = codes.indexOf(saved) >= 0 ? saved : ''
        if (!lang) {
          var list = navigator.languages || [navigator.language || '']
          for (var i = 0; i < list.length; i++) {
            var base = String(list[i]).toLowerCase().split('-')[0]
            if (base === 'zh') {
              lang = 'zh'
              break
            }
            if (codes.indexOf(base) >= 0) {
              lang = base
              break
            }
          }
        }
        var prefix = parts.length ? '/' + parts.join('/') : ''
        location.replace(prefix + '/' + (lang || 'da') + '/')
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
